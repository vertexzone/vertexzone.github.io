.visible!==false,color:'linear-gradient(135deg,#312e81,#0891b2)'}));}catch(e){}\n return [...defaults,...custom,...published];\n}\nlet games=readGames(),activeCategory='All';\nconst $=id=\u003edocument.getElementById(id);\nfunction safeText(v){return String(v??'')}\nfunction renderGames(){const q=$('search').value.trim().toLowerCase();const filtered=games.filter(g=\u003eg.visible!==false\u0026\u0026(activeCategory==='All'||g.category===activeCategory)\u0026\u0026[g.name,g.category,g.description].join(' ').toLowerCase().includes(q));$('gameGrid').innerHTML='';filtered.forEach(g=\u003e{const card=document.createElement('article');card.className='game-card';const art=document.createElement('div');art.className='game-art';art.style.background=g.color||'linear-gradient(135deg,#312e81,#0891b2)';if(g.logo){const img=document.createElement('img');img.src=g.logo;img.alt=safeText(g.name)+' logo';img.onerror=()=\u003e{img.remove();art.textContent=g.emoji||'🎮'};art.appendChild(img)}else art.textContent=g.emoji||g.icon||'🎮';const info=document.createElement('div');info.className='game-info';const title=document.createElement('h3');title.textContent=safeText(g.name);const desc=document.createElement('p');desc.textContent=safeText(g.description);const bottom=document.createElement('div');bottom.className='game-bottom';const status=document.createElement('span');status.textContent=g.apk?'READY TO PLAY':'COMING SOON';const btn=document.createElement('button');btn.className='get-btn';btn.textContent=g.apk?'GET':'VIEW';btn.addEventListener('click',()=\u003eopenGame(g));bottom.append(status,btn);info.append(title,desc,bottom);card.append(art,info);card.addEventListener('click',()=\u003eopenGame(g));$('gameGrid').appendChild(card)});$('gameCount').textContent=filtered.length+' Games';$('empty').style.display=filtered.length?'none':'block'}\nfunction openGame(g){$('modalArt').innerHTML='';$('modalArt').style.background=g.color||'linear-gradient(135deg,#312e81,#0891b2)';if(g.logo){const img=document.createElement('img');img.src=g.logo;img.alt=safeText(g.name)+' logo';$('modalArt').appendChild(img)}else $('modalArt').textContent=g.emoji||g.icon||'🎮';$('modalName').textContent=safeText(g.name);$('modalCategory').textContent=safeText(g.category)+' • '+(g.apk?'Available':'Coming Soon');$('modalDescription').textContent=safeText(g.description);const dl=$('modalDownload');dl.disabled=!g.apk;dl.textContent=g.apk?'DOWNLOAD APK':'COMING SOON';dl.onclick=()=\u003e{if(g.apk){window.open(g.apk,'_blank','noopener,noreferrer')}};$('gameModal').classList.add('show')}\nfunction closeModal(){$('gameModal').classList.remove('show')}\ndocument.querySelectorAll('#categories button').forEach(b=\u003eb.addEventListener('click',()=\u003e{activeCategory=b.dataset.category;document.querySelectorAll('#categories button').forEach(x=\u003ex.classList.toggle('active',x===b));renderGames()}));$('search').addEventListener('input',renderGames);$('closeModal').addEventListener('click',closeModal);$('gameModal').addEventListener('click',e=\u003e{if(e.target===$('gameModal'))closeModal()});document.addEventListener('keydown',e=\u003e{if(e.key==='Escape')closeModal()});window.addEventListener('storage',e=\u003e{if(e.key===KEY||e.key===APP_KEY){games=readGames();renderGames()}});$('year').textContent=new Date().getFullYear();renderGames();setTimeout(()=\u003e$('splash').classList.add('hide'),1400);\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e";

{name:"Mobile App Interface",category:"APP CONCEPT",description:"A clean and responsive interface concept for mobile users."},
{name:"Custom Digital Solution",category:"CUSTOM PROJECT",description:"Digital experiences planned around specific project requirements."}
];
const getProjects=()=&gt;read(KEYS.projects,defaultProjects.map(p=&gt;({...p,visible:true})));
const getApps=()=&gt;read(KEYS.apps,[]);
const getEnquiries=()=&gt;read(KEYS.enquiries,[]);
const getSettings=()=&gt;read(KEYS.settings,{heading:"BUILD YOUR DIGITAL FUTURE.",description:"We transform your ideas into powerful digital experiences. From professional websites to custom digital solutions, we help your vision move forward."});
$("menuBtn").addEventListener("click",()=&gt;$("navLinks").classList.toggle("show"));
document.querySelectorAll(".nav-links a").forEach(a=&gt;a.addEventListener("click",()=&gt;$("navLinks").classList.remove("show")));
$("year").textContent=new Date().getFullYear();

function renderProjects(){
const stored=getProjects();let migrated=false;stored.forEach((p,i)=&gt;{if(!p.id){p.id="legacy-"+i+"-"+p.name;migrated=true}if(p.visible===undefined){p.visible=true;migrated=true}});if(migrated)write(KEYS.projects,stored);
const grid=$("workGrid");grid.innerHTML="";
getProjects().filter(p=&gt;p.visible!==false).forEach(p=&gt;{
const article=document.createElement("article");article.className="card work-card";
const preview=document.createElement("div");preview.className="work-preview";
const logo=document.createElement("div");logo.className="preview-logo gradient";logo.textContent="VERTEX";preview.appendChild(logo);
const info=document.createElement("div");info.className="work-info";
const label=document.createElement("span");label.className="work-label";label.textContent=p.category;
const title=document.createElement("h3");title.textContent=p.name;
const desc=document.createElement("p");desc.textContent=p.description;
info.append(label,title,desc);article.append(preview,info);grid.appendChild(article);
});
$("projectCount").textContent=getProjects().filter(p=&gt;p.visible!==false).length;$("dashProjects").textContent=getProjects().length;
}
function renderApps(){
const grid=$("appGrid");grid.innerHTML="";const apps=getApps();
if(!apps.length){grid.innerHTML='&lt;div class="empty-state"&gt;No apps published yet.&lt;/div&gt;';return}
apps.forEach(app=&gt;{const card=document.createElement("article");card.className="card";
if(app.logo){const img=document.createElement("img");img.className="app-logo";img.src=app.logo;img.alt=app.name+" logo";card.appendChild(img)}
const body=document.createElement("div");body.style.padding="20px";const title=document.createElement("h3");title.textContent=app.name;
const desc=document.createElement("p");desc.textContent=app.description;const link=document.createElement("a");link.className="app-download";link.href=app.link;link.target="_blank";link.rel="noopener noreferrer";link.textContent="DOWNLOAD APK ↓";
body.append(title,desc,link);card.appendChild(body);grid.appendChild(card)});
}
function updateCounts(){const count=getEnquiries().length;$("enquiryCount").textContent=count;$("dashEnquiries").textContent=count}
function applySettings(){const s=getSettings();$("heroHeading").textContent=s.heading;$("heroDescription").textContent=s.description;$("settingHeading").value=s.heading;$("settingDescription").value=s.description}
renderProjects();renderApps();updateCounts();applySettings();

// Enquiry submission: saved in this browser and also opened as a pre-filled WhatsApp message.
$("contactForm").addEventListener("submit",function(e){
e.preventDefault();
const enquiry={id:Date.now(),name:$("clientName").value.trim(),phone:$("clientPhone").value.trim(),type:$("projectType").value,details:$("projectDetails").value.trim(),date:new Date().toLocaleString()};
if(!enquiry.name||!enquiry.phone||!enquiry.type||!enquiry.details){alert("Please fill in all fields.");return}
const data=getEnquiries();data.unshift(enquiry);
if(!write(KEYS.enquiries,data))return;
updateCounts();
const message=`New VERTEX WEB.DEV enquiry%0AName: ${encodeURIComponent(enquiry.name)}%0APhone: ${encodeURIComponent(enquiry.phone)}%0AProject: ${encodeURIComponent(enquiry.type)}%0ADetails: ${encodeURIComponent(enquiry.details)}`;
$("contactForm").reset();
window.open("https://wa.me/918299430855?text="+message,"_blank","noopener");
alert("Enquiry saved on this device. WhatsApp will open so you can send it.");
});

// Admin navigation and login
function showAdmin(){
$("mainSite").style.display="none";$("admin").style.display="block";window.scrollTo(0,0);
$("loginBox").style.display="block";$("dashboard").style.display="none";$("loginMessage").textContent="";
}
function showWebsite(){ $("admin").style.display="none";$("mainSite").style.display="block";window.scrollTo(0,0)}
$("adminNav").addEventListener("click",e=&gt;{e.preventDefault();showAdmin()});
$("backBtn").addEventListener("click",showWebsite);
$("loginBtn").addEventListener("click",()=&gt;{
const id=$("adminId").value.trim().toLowerCase(),password=$("adminPassword").value.trim();
if(id===ADMIN_ID.toLowerCase()&amp;&amp;password===ADMIN_PASSWORD){
$("loginMessage").textContent="";$("loginBox").style.display="none";$("dashboard").style.display="block";
$("loggedAdmin").textContent=$("adminName").value;renderAdmin();applySettings();
}else{$("loginMessage").textContent="Incorrect Admin ID or password."}

$("adminPassword").addEventListener("keydown",e=&gt;{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").addEventListener("click",()=&gt;{ $("dashboard").style.display="none";$("loginBox").style.display="block";$("adminId").value="";$("adminPassword").value="";showWebsite()});

function renderEnquiries(){
const box=$("adminEnquiries");box.innerHTML="";const items=getEnquiries();
if(!items.length){box.innerHTML='&lt;div class="empty-state"&gt;No enquiries received on this device yet.&lt;/div&gt;';return}
items.forEach(item=&gt;{
const div=document.createElement("div");div.className="admin-item";
const heading=document.createElement("strong");heading.textContent=item.name+" — "+item.type;
const p=document.createElement("p");p.textContent=`Contact: ${item.phone}\nDetails: ${item.details}\nDate: ${item.date}`;
const del=document.createElement("button");del.className="small-btn danger";del.textContent="DELETE";
del.addEventListener("click",()=&gt;{if(confirm("Delete this enquiry?")){write(KEYS.enquiries,getEnquiries().filter(x=&gt;x.id!==item.id));renderEnquiries();updateCounts()}});
div.append(heading,p,del);box.appendChild(div);
});
}
function renderAdminProjects(){
const box=$("adminProjects");box.innerHTML="";
getProjects().forEach(p=&gt;{
const div=document.createElement("div");div.className="admin-item";
const title=document.createElement("strong");title.textContent=p.name+" — "+p.category;
const status=document.createElement("span");status.className="status-pill";status.textContent=p.visible===false?"HIDDEN / BANNED":"LIVE ON WEBSITE";if(p.visible!==false){status.style.borderColor="#00d69a";status.style.color="#00d69a"}
const desc=document.createElement("p");desc.textContent=p.description;
const toggle=document.createElement("button");toggle.className="small-btn"+(p.visible===false?"":" danger");toggle.textContent=p.visible===false?"UNBAN / SHOW ON WEBSITE":"BAN / HIDE FROM WEBSITE";
toggle.addEventListener("click",()=&gt;{const list=getProjects();const item=list.find(x=&gt;x.id===p.id);if(item){item.visible=item.visible===false;write(KEYS.projects,list);renderProjects();renderAdminProjects()}});
const del=document.createElement("button");del.className="small-btn danger";del.textContent="DELETE PERMANENTLY";
del.addEventListener("click",()=&gt;{if(confirm("Permanently delete this project?")){write(KEYS.projects,getProjects().filter(x=&gt;x.id!==p.id));renderProjects();renderAdminProjects()}});
div.append(title,status,desc,toggle,del);box.appendChild(div);
});
if(!getProjects().length)box.innerHTML='&lt;div class="empty-state"&gt;No projects added yet.&lt;/div&gt;';
}
function renderAdminApps(){const box=$("adminApps");box.innerHTML="";const apps=getApps();
if(!apps.length){box.innerHTML='&lt;div class="empty-state"&gt;No apps published yet.&lt;/div&gt;';return}
apps.forEach(app=&gt;{const div=document.createElement("div");div.className="admin-item";const title=document.createElement("strong");title.textContent=app.name;
const desc=document.createElement("p");desc.textContent=app.description+"\nAPK: "+app.link;
const del=document.createElement("button");del.className="small-btn danger";del.textContent="REMOVE APP";del.addEventListener("click",()=&gt;{if(confirm("Remove this app from the website?")){write(KEYS.apps,getApps().filter(x=&gt;x.id!==app.id));renderApps();renderAdminApps()}});
div.append(title,desc,del);box.appendChild(div)});
}
function renderAdminStoreGames(){
 const box=$("adminStoreGames");if(!box)return;box.innerHTML="";
 let games=[];try{const saved=localStorage.getItem("vertexPlayGamesV2");games=saved?JSON.parse(saved):[]}catch(e){games=[]}
 if(!Array.isArray(games))games=[];
 if(!games.length){box.innerHTML='&lt;div class="empty-state"&gt;No coming-soon games added yet.&lt;/div&gt;';return}
 games.forEach(game=&gt;{
  const div=document.createElement("div");div.className="admin-item";
  const title=document.createElement("strong");title.textContent=game.name||"Untitled game";
  const status=document.createElement("span");status.className="status-pill";status.textContent=game.visible===false?"HIDDEN":(game.apk?"LIVE / APK READY":"COMING SOON");
  const desc=document.createElement("p");desc.textContent=(game.category||"Other")+"\n"+(game.description||"")+(game.apk?"\nAPK: "+game.apk:"\nNo APK link yet");
  const launch=document.createElement("button");launch.className="small-btn";launch.textContent=game.apk?"UPDATE APK LINK":"LAUNCH / ADD APK";
  launch.addEventListener("click",()=&gt;{const url=prompt("Enter secure HTTPS APK link:",game.apk||"");if(url===null)return;if(!/^https:\/\//i.test(url.trim())){alert("Please enter a valid HTTPS link.");return}const list=JSON.parse(localStorage.getItem("vertexPlayGamesV2")||"[]");const item=list.find(x=&gt;String(x.id)===String(game.id));if(item){item.apk=url.trim();item.visible=true;localStorage.setItem("vertexPlayGamesV2",JSON.stringify(list));renderAdminStoreGames();alert("Game launched. APK link saved.")}});
  const toggle=document.createElement("button");toggle.className="small-btn";toggle.textContent=game.visible===false?"SHOW GAME":"HIDE GAME";
  toggle.addEventListener("click",()=&gt;{const list=JSON.parse(localStorage.getItem("vertexPlayGamesV2")||"[]");const item=list.find(x=&gt;String(x.id)===String(game.id));if(item){item.visible=item.visible===false;localStorage.setItem("vertexPlayGamesV2",JSON.stringify(list));renderAdminStoreGames()}});
  const del=document.createElement("button");del.className="small-btn danger";del.textContent="REMOVE GAME";del.addEventListener("click",()=&gt;{if(confirm("Remove this game from Play Store?")){const list=JSON.parse(localStorage.getItem("vertexPlayGamesV2")||"[]").filter(x=&gt;String(x.id)!==String(game.id));localStorage.setItem("vertexPlayGamesV2",JSON.stringify(list));renderAdminStoreGames()}});
  div.append(title,status,desc,launch,toggle,del);box.appendChild(div);
 });
}
function renderAdmin(){renderEnquiries();renderAdminProjects();renderAdminApps();renderAdminStoreGames();updateCounts();renderProjects();renderApps()}
document.querySelectorAll(".admin-tab").forEach(btn=&gt;btn.addEventListener("click",()=&gt;{
document.querySelectorAll(".admin-tab").forEach(b=&gt;b.classList.remove("active"));
document.querySelectorAll(".admin-panel").forEach(p=&gt;p.classList.remove("active"));
btn.classList.add("active");$(btn.dataset.tab).classList.add("active");
}));

$("projectForm").addEventListener("submit",e=&gt;{
e.preventDefault();
const project={id:Date.now()+Math.random(),name:$("newProjectName").value.trim(),category:$("newProjectCategory").value.trim().toUpperCase(),description:$("newProjectDescription").value.trim(),visible:true};
if(!project.name||!project.category||!project.description)return;
const projects=getProjects();projects.push(project);
if(write(KEYS.projects,projects)){$("projectForm").reset();renderProjects();renderAdminProjects();alert("Project added successfully.")}

$("appForm").addEventListener("submit",e=&gt;{
e.preventDefault();const file=$("newAppLogo").files[0];const link=$("newAppLink").value.trim();
if(!file){alert("Please choose an app logo.");return}
if(file.size&gt;1500000){alert("Please use a logo smaller than 1.5 MB.");return}
if(!/^https:\/\//i.test(link)){alert("Please enter a secure HTTPS APK link.");return}
const reader=new FileReader();reader.onload=()=&gt;{const apps=getApps();apps.unshift({id:Date.now()+Math.random(),name:$("newAppName").value.trim(),description:$("newAppDescription").value.trim(),link,logo:reader.result});
if(write(KEYS.apps,apps)){$("appForm").reset();renderApps();renderAdminApps();alert("App published on your website.")}};reader.onerror=()=&gt;alert("Could not read the logo file.");reader.readAsDataURL(file);
});

$("storeGameForm").addEventListener("submit",e=&gt;{
 e.preventDefault();const file=$("storeGamePoster").files[0];const apk=$("storeGameApk").value.trim();
 if(!file){alert("Please choose a game poster.");return}
 if(file.size&gt;1500000){alert("Please use a poster smaller than 1.5 MB.");return}
 if(apk&amp;&amp;!/^https:\/\//i.test(apk)){alert("APK link must start with HTTPS.");return}
 const reader=new FileReader();reader.onload=()=&gt;{
  let games=[];try{games=JSON.parse(localStorage.getItem("vertexPlayGamesV2")||"[]")}catch(err){games=[]}if(!Array.isArray(games))games=[];
  games.push({id:"admin-game-"+Date.now()+"-"+Math.random().toString(36).slice(2),name:$("storeGameName").value.trim(),category:$("storeGameCategory").value,description:$("storeGameDescription").value.trim(),logo:reader.result,emoji:"🎮",color:"linear-gradient(135deg,#312e81,#0891b2)",apk,visible:true});
  try{localStorage.setItem("vertexPlayGamesV2",JSON.stringify(games));$("storeGameForm").reset();renderAdminStoreGames();alert(apk?"Game added and APK is ready.":"Coming Soon game and poster added successfully.")}catch(err){alert("Could not save. Please use a smaller poster or free up browser storage.")}
 };reader.onerror=()=&gt;alert("Could not read poster file.");reader.readAsDataURL(file);
});
$("settingsForm").addEventListener("submit",e=&gt;{
e.preventDefault();const settings={heading:$("settingHeading").value.trim(),description:$("settingDescription").value.trim()};
if(!settings.heading||!settings.description)return;
if(write(KEYS.settings,settings)){applySettings();alert("Website settings saved in this browser.")}

<script>
const box = document.getElementById('codeBox');
const status = document.getElementById('status');
document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(box.value);
    status.textContent = 'Copied! Ab jahan chaho paste kar do.';
  } catch (err) {
    box.focus();
    box.select();
    const ok = document.execCommand('copy');
    status.textContent = ok ? 'Copied! Ab paste kar do.' : 'Auto-copy nahi hua. Code box select hai — Copy option use karo.';
  }
});
</script>
